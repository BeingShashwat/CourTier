spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/courtier}
    username: ${DB_USERNAME:courtier}
    password: ${DB_PASSWORD:courtier}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:courtier.noreply@gmail.com}
    password: ${MAIL_PASSWORD:placeholder_app_password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.courtier.courtier: DEBUG
    org.hibernate.SQL: DEBUG

courtier:
  jwt:
    # 256-bit base64 secret: ab12cd34ef56gh78ijklmnopqrstuvwx
    secret: ${JWT_SECRET:YWIxMmNkMzRlZjU2Z2g3OGlqa2xtbm9wcXJzdHV2d3g=}
